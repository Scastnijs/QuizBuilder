<!DOCTYPE html>
<html lang="{{ text.html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ text.language_page_title }}</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .language-options { display:flex; justify-content:center; gap:40px; flex-wrap:wrap; }
        .language-button { width:200px; padding:20px; border:2px solid #dee2e6; border-radius:12px; background:white; cursor:pointer; transition:transform .2s, box-shadow .2s, border-color .2s; }
        .language-button:hover { transform:translateY(-4px); box-shadow:0 6px 15px rgba(0,0,0,.15); border-color:#007bff; }
        .language-flag { display:block; width:120px; height:80px; object-fit:cover; margin:0 auto 15px; border:1px solid #dee2e6; }
        .language-button span { display:block; font-size:1.1rem; font-weight:500; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body text-center p-5">
            <h2 class="mb-3">{{ text.language_heading }}</h2>
            <p class="text-muted mb-4">{{ text.language_prompt }}</p>

            <form method="POST" action="{{ url_for('start_quiz') }}">
                <div class="language-options">
                    <button type="submit" name="language" value="en" class="language-button">
                        <img src="{{ url_for('static', filename='flags/en.svg') }}" alt="{{ text.language_english }}" class="language-flag">
                        <span>{{ text.language_english }}</span>
                    </button>
                    <button type="submit" name="language" value="lv" class="language-button">
                        <img src="{{ url_for('static', filename='flags/lv.svg') }}" alt="{{ text.language_latvian }}" class="language-flag">
                        <span>{{ text.language_latvian }}</span>
                    </button>
                    <button type="submit" name="language" value="de" class="language-button">
                        <img src="{{ url_for('static', filename='flags/de.svg') }}" alt="{{ text.language_german }}" class="language-flag">
                        <span>{{ text.language_german }}</span>
                    </button>
                    <button type="submit" name="language" value="ua" class="language-button">
                        <img src="{{ url_for('static', filename='flags/ua.svg') }}" alt="{{ text.language_ukrainian }}" class="language-flag">
                        <span>{{ text.language_ukrainian }}</span>
                    </button>
                    <button type="submit" name="language" value="bg" class="language-button">
                        <img src="{{ url_for('static', filename='flags/bg.svg') }}" alt="{{ text.language_bulgarian }}" class="language-flag">
                        <span>{{ text.language_bulgarian }}</span>
                    </button>
                    <button type="submit" name="language" value="cz" class="language-button">
                        <img src="{{ url_for('static', filename='flags/cz.svg') }}" alt="{{ text.language_czech }}" class="language-flag">
                        <span>{{ text.language_czech }}</span>
                    </button>
                    <button type="submit" name="language" value="ee" class="language-button">
                        <img src="{{ url_for('static', filename='flags/ee.svg') }}" alt="{{ text.language_estonian }}" class="language-flag">
                        <span>{{ text.language_estonian }}</span>
                    </button>
                    <button type="submit" name="language" value="fi" class="language-button">
                        <img src="{{ url_for('static', filename='flags/fi.svg') }}" alt="{{ text.language_finnish }}" class="language-flag">
                        <span>{{ text.language_finnish }}</span>
                    </button>
                    <button type="submit" name="language" value="fr" class="language-button">
                        <img src="{{ url_for('static', filename='flags/fr.svg') }}" alt="{{ text.language_french }}" class="language-flag">
                        <span>{{ text.language_french }}</span>
                    </button>
                    <button type="submit" name="language" value="hu" class="language-button">
                        <img src="{{ url_for('static', filename='flags/hu.svg') }}" alt="{{ text.language_hungarian }}" class="language-flag">
                        <span>{{ text.language_hungarian }}</span>
                    </button>
                    <button type="submit" name="language" value="is" class="language-button">
                        <img src="{{ url_for('static', filename='flags/is.svg') }}" alt="{{ text.language_icelandic }}" class="language-flag">
                        <span>{{ text.language_icelandic }}</span>
                    </button>
                    <button type="submit" name="language" value="it" class="language-button">
                        <img src="{{ url_for('static', filename='flags/it.svg') }}" alt="{{ text.language_italian }}" class="language-flag">
                        <span>{{ text.language_italian }}</span>
                    </button>
                    <button type="submit" name="language" value="lt" class="language-button">
                        <img src="{{ url_for('static', filename='flags/lt.svg') }}" alt="{{ text.language_lithuanian }}" class="language-flag">
                        <span>{{ text.language_lithuanian }}</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
