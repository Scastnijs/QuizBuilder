<!DOCTYPE html>
<html lang="{{ text.html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ text.language_page_title }}</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .language-options { display:flex; justify-content:center; gap:40px; flex-wrap:wrap; }
        .language-button { width:200px; padding:20px; border:2px solid #dee2e6; border-radius:12px; background:white; cursor:pointer; transition:transform .2s, box-shadow .2s, border-color .2s; }
        .language-button:hover { transform:translateY(-4px); box-shadow:0 6px 15px rgba(0,0,0,.15); border-color:#007bff; }
        .language-flag { display:block; width:120px; height:80px; object-fit:cover; margin:0 auto 15px; border:1px solid #dee2e6; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body text-center p-5">
            <h2 class="mb-3">{{ text.language_heading }}</h2>
            <p class="text-muted mb-4">{{ text.language_prompt }}</p>

            <form method="POST" action="{{ url_for('start_quiz') }}">
                <div class="language-options">
                    <button type="submit" name="language" value="en" class="language-button" aria-label="English">
                        <img src="{{ url_for('static', filename='flags/en.svg') }}" alt="" aria-hidden="true" class="language-flag">
                    </button>
                    <button type="submit" name="language" value="lv" class="language-button" aria-label="Latvian">
                        <img src="{{ url_for('static', filename='flags/lv.svg') }}" alt="" aria-hidden="true" class="language-flag">

                    <button type="submit" name="language" value="fr" class="language-button" aria-label="French">

</html>
