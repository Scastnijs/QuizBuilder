<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preparing Quiz</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .step-track {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-top: 24px;
        }
        .step {
            height: 18px;
            border-radius: 4px;
            background: #dee2e6;
            transition: background-color 0.25s ease;
        }
        .step.complete {
            background: #28a745;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body text-center p-5">
            <h2>Preparing your quiz...</h2>
            <p class="text-muted mb-1">Translating questions to Latvian</p>
            <h4 id="progress-text">0 / {{ total }}</h4>

            <div class="step-track" aria-label="Question translation progress">
                {% for step in range(1, total + 1) %}
                    <div class="step" id="step-{{ step }}" title="Question {{ step }}"></div>
                {% endfor %}
            </div>

            <div class="progress mt-4" style="height: 24px;">
                <div id="progress-bar"
                     class="progress-bar progress-bar-striped progress-bar-animated"
                     role="progressbar"
                     style="width: 0%;"
                     aria-valuenow="0"
                     aria-valuemin="0"
                     aria-valuemax="100">0%</div>
            </div>

            <div id="error-message" class="alert alert-danger mt-4 d-none"></div>
        </div>
    </div>
</div>

<script>
(function () {
    const total = {{ total|tojson }};
    const progressUrl = {{ url_for('quiz_progress', job_id=job_id)|tojson }};
    const readyUrl = {{ url_for('quiz_ready', job_id=job_id)|tojson }};
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const errorMessage = document.getElementById('error-message');

    function renderProgress(completed) {
        const safeCompleted = Math.max(0, Math.min(total, completed));
        const percent = Math.round((safeCompleted / total) * 100);

        progressText.textContent = `${safeCompleted} / ${total}`;
        progressBar.style.width = `${percent}%`;
        progressBar.setAttribute('aria-valuenow', percent);
        progressBar.textContent = `${percent}%`;

        for (let step = 1; step <= total; step += 1) {
            document.getElementById(`step-${step}`).classList.toggle(
                'complete', step <= safeCompleted
            );
        }
    }

    async function pollProgress() {
        try {
            const response = await fetch(progressUrl, {cache: 'no-store'});
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Unable to read quiz progress.');
            }

            renderProgress(data.completed);

            if (data.error) {
                errorMessage.textContent = data.error;
                errorMessage.classList.remove('d-none');
                return;
            }

            if (data.done && data.completed >= total) {
                progressBar.classList.remove('progress-bar-animated');
                window.location.replace(readyUrl);
                return;
            }

            window.setTimeout(pollProgress, 500);
        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('d-none');
        }
    }

    pollProgress();
}());
</script>
</body>
</html>
