<!DOCTYPE html>
<html lang="{{ text.html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ text.quiz_builder_title }}</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h4 class="mb-4">
                {{ text.question_label }} {{ current }} / {{ total }}
            </h4>
            <form method="POST">
                <h5 class="mb-4">{{ question.question }}</h5>
                {% for answer in question.answers %}
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="answer"
                               id="answer-{{ loop.index }}" value="{{ answer }}" required>
                        <label class="form-check-label" for="answer-{{ loop.index }}">
                            {{ answer }}
                        </label>
                    </div>
                {% endfor %}
                <button class="btn btn-primary mt-4" type="submit">
                    {{ text.next }}
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
